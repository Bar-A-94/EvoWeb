# Optional: a Karpenter node pool for EvoWeb pods (AWS). Replace <your-cluster>, then
# kubectl apply -f infra/karpenter.yaml. To use it, add to the pod spec in job-template.yaml:
#   nodeSelector: {karpenter.sh/nodepool: evoweb}
#   tolerations: [{key: evoweb, operator: Equal, value: "true", effect: NoSchedule}]
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: evoweb-node-class
spec:
  amiSelectorTerms:
  - alias: al2023@latest
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      deleteOnTermination: true
      encrypted: true
      volumeSize: 100Gi
      volumeType: gp3
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  role: KarpenterNodeRole-<your-cluster>
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: <your-cluster>
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: <your-cluster>
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: evoweb
spec:
  disruption:
    budgets:
    - nodes: 10%
    consolidateAfter: 5m
    consolidationPolicy: WhenEmpty
  limits:
    cpu: "4096"
    memory: 8192Gi
  template:
    metadata:
      labels:
        type: evoweb
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: evoweb-node-class
      requirements:
      - key: karpenter.k8s.aws/instance-family
        operator: In
        values:
        - m5
      - key: karpenter.k8s.aws/instance-size
        operator: In
        values:
        - 4xlarge
        - 8xlarge
        - 12xlarge
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
        - spot
      taints:
      - effect: NoSchedule
        key: evoweb
        value: "true"
